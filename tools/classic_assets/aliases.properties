# --- Settlements (Phase 1) -----------------------------------------------
# Original Sid Meier's Colonization colony & native-settlement map-sprites also
# come from ICONS.SS.  Frame->settlement mapping (labelled montage + eyeball,
# same method as the units above; scratchpad Montage.java ICONS.SS 0 13):
#   Colonies (blue flag):  000 open colony (ring of buildings, no wall)
#     001 wooden stockade   002 grey stone fort/fortress   003 sparse huts (a
#     just-founded / smallest colony).  Col1's colony sprite tracks FORTIFICATION
#     (and, loosely, size) -- see the colony block below for how that folds onto
#     FreeCol's size x stockade keys.
#   Natives:  010 teepee cluster (camp)  011 tan longhouse (village)
#     012 terraced pyramid (aztec)  013 grey stone city (inca).
# Rendered through the same drawCentered up-scale branch as the unit sprites
# (ClassicMapViewer.paintTile draws the settlement via getScaledSettlementImage,
# so the ~16px frame up-scales nearest-neighbour into the cell).

# Native settlements: keyed by settlement-type id (camp/village/inca/aztec).
# getSettlementKey appends only ".mission" (when a missionary is present); the
# ".capital"/".capital.mission" keys are aliased too for safety though the
# current code path does not build them.

# Colonies key off apparent size (small<=3, medium<=7, large units) plus the
# stockade level (none / stockade / fort / fortress), and FreeCol prefers a
# per-nation frame when one exists -- and the base pack defines one for every
# European nation, so getSettlementKey resolves e.g. ...colony.small.dutch and
# the neutral ...colony.small alias below would never be reached.  We therefore
# alias the per-nation keys directly (all 8 nation suffixes returned by
# Player.getNationResourceKey), collapsing Col1's real signal -- FORTIFICATION
# -- onto FreeCol's size x stockade grid: unfortified colonies grow 003(small)
# ->000(medium/large), a stockade is 001, a fort/fortress is the stone 002 (a
# fortress-distinct frame is a follow-up).  The base non-nation keys below the
# per-nation block catch REF-captured colonies (no ...<nationREF> art exists).

